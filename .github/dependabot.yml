version: 2

# The other half of the `npm audit` gate in ci.yml: the gate reports a finding, Dependabot
# delivers the pull request. Target is `dev`, like every other change.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    # Three at a time: every open pull request is a candidate for another run.
    open-pull-requests-limit: 3
    # No automatic rebase: every merge to dev would re-create the open pull requests, and every
    # re-created one is a full CI run. A rebase on demand still works: `@dependabot rebase` as
    # a comment on the pull request.
    rebase-strategy: disabled
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One pull request per toolchain, not one per package: eslint and vitest move together.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
